<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lagoon</title>
<style>
  html,body{margin:0;height:100%;background:#0a2a4a;overflow:hidden;
    font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  canvas{filter:contrast(1.07) saturate(1.14)}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,10,.34) 100%)}
  .pill,#joy,#hint{z-index:2}
  #glare{position:fixed;left:0;top:0;width:90vmax;height:90vmax;margin:-45vmax 0 0 -45vmax;border-radius:50%;pointer-events:none;z-index:1;opacity:0;
    mix-blend-mode:screen;will-change:transform,opacity;
    background:radial-gradient(circle,rgba(255,246,220,.75) 0%,rgba(255,226,170,.28) 18%,rgba(255,210,150,.08) 42%,rgba(255,210,150,0) 65%)}
  #uw{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity .3s ease;
    background:linear-gradient(rgba(0,130,160,.22),rgba(0,45,85,.48))}
  #uw:before{content:'';position:absolute;top:-10%;bottom:0;left:-30%;right:-30%;mix-blend-mode:screen;opacity:var(--ray,1);
    background:repeating-linear-gradient(103deg,rgba(255,255,255,0) 0,rgba(255,255,255,0) 7%,rgba(200,255,250,.13) 9%,rgba(200,255,250,.13) 11%,rgba(255,255,255,0) 14%,rgba(255,255,255,0) 23%,rgba(200,255,250,.09) 25%,rgba(200,255,250,.09) 29%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 40%);
    -webkit-mask-image:linear-gradient(#000 0%,rgba(0,0,0,.55) 45%,transparent 82%);mask-image:linear-gradient(#000 0%,rgba(0,0,0,.55) 45%,transparent 82%);
    animation:rays 9s ease-in-out infinite alternate}
  @keyframes rays{from{transform:translateX(-5%) skewX(-4deg)}to{transform:translateX(5%) skewX(4deg)}}
  #title{position:fixed;left:0;right:0;top:30%;text-align:center;color:#fff;pointer-events:none;z-index:2;transition:opacity 2.2s ease;
    text-shadow:0 2px 18px rgba(0,20,40,.55)}
  #title h1{margin:0;font-weight:300;font-size:44px;letter-spacing:.42em;text-indent:.42em}
  #title p{margin:10px 0 0;font-size:12px;letter-spacing:.3em;text-transform:uppercase;opacity:.85}
  #cap{position:fixed;left:0;right:0;top:17%;text-align:center;color:#fff;pointer-events:none;z-index:2;opacity:0;transition:opacity 1.1s ease;
    text-shadow:0 1px 12px rgba(0,20,40,.6)}
  #cap b{display:block;font-weight:400;font-size:22px;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase}
  #cap span{display:block;margin-top:7px;font-size:11px;letter-spacing:.2em;font-style:italic;opacity:.85}
  .pill,#joy,#hint{transition:opacity 1.5s ease}
  body.intro .pill,body.intro #joy,body.intro #hint{opacity:0}
  .pill{position:fixed;top:14px;background:rgba(255,255,255,.18);color:#fff;
    border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:9px 14px;font:inherit;
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #tod{right:14px}
  #menu{position:fixed;top:56px;right:10px;z-index:3;padding:8px 10px;border-radius:14px;max-width:95vw;color:#fff;
    background:rgba(8,28,48,.58);border:1px solid rgba(255,255,255,.25);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  #menu .mrow{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:6px 0;padding-left:44px}
  #menu .mrow span{width:44px;margin-left:-44px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
  .mopt{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:7px 8px;
    font:inherit;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase}
  .mopt.on{background:rgba(255,255,255,.88);color:#123}
  body.intro #menu{display:none}
  #joy{position:fixed;left:22px;bottom:34px;width:128px;height:128px;border-radius:50%;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.45);touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
    background:rgba(255,255,255,.55);pointer-events:none}
  #hint{position:fixed;left:170px;right:14px;bottom:84px;text-align:center;pointer-events:none;
    font-size:11px;letter-spacing:.16em;line-height:1.7;text-transform:uppercase;color:#fff;
    text-shadow:0 1px 6px rgba(0,0,0,.5);transition:opacity 2s ease}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    padding:30px;text-align:center;line-height:1.6;color:#fff;background:#0a2a4a}
</style>
</head>
<body>
<button id="snd" class="mopt" style="display:none">waves off</button>
<button id="tod" class="pill">day</button>
<div id="joy"><div id="knob"></div></div>
<div id="hint">stick to walk<br>drag to look</div>
<div id="vig"></div>
<div id="glare"></div>
<div id="uw"></div>
<div id="title"><h1>LAGOON</h1><p>an island made of code</p></div>
<div id="cap"></div>
<div id="err"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
var GLSL_SRC={
"cloudbake.frag": "uniform vec3 uLight;uniform vec2 uCRes;\n#include \"noise\"\n#include \"cloudfield\"\nvoid main(){\n  vec2 uv=gl_FragCoord.xy/uCRes;\n  float az=(uv.x-.5)*6.28318,el=1.5708*(.5*uv.y+.5*uv.y*uv.y);\n  vec3 d=vec3(cos(az)*cos(el),sin(el),sin(az)*cos(el));\n  float a=(1.-d.y*d.y)*I2R;\n  float s0=2.*HB/(d.y+sqrt(d.y*d.y+4.*a*HB)),s1=min(2.*HT/(d.y+sqrt(d.y*d.y+4.*a*HT)),105.);\n  float k=pow(s1/s0,1./64.),jit=hash(gl_FragCoord.xy+uCT.w);\n  float s=s0*pow(k,hash(gl_FragCoord.yx*1.3+uCT.w)-1.);\n  float ph=1.+1.3*pow(max(dot(d,uLight),0.),5.);\n  vec3 acc=vec3(0.);float T=1.;\n  for(int i=0;i<64;i++){\n    float ds=s*(k-1.);\n    vec3 pm=d*(s+.5*ds);\n    vec2 w=weather(pm);\n    if(w.x>.01&&d.y*s+s*s*a<w.y){\n      for(int j=0;j<6;j++){\n        vec3 p=d*(s+ds*(float(j)+jit)/6.);\n        vec2 c=cloud(p,weather(p),1.);\n        if(c.x>.003){\n          float tau=0.,ls=.07*(.55+.9*hash(gl_FragCoord.xy*1.7+float(j)*13.1+uCT.w));vec3 lp=p;\n          for(int l=0;l<6;l++){lp+=uLight*ls;tau+=cloud(lp,weather(lp),0.).x*ls;ls*=1.8;}\n          float od=tau*SIGL;\n          float sun=max(exp(-od),.68*exp(-od*.22))*ph;\n          float amb=.5+.5*c.y;\n          float al=1.-exp(-SIG*c.x*ds/6.);\n          float f=1.-exp(-s/70.);\n          acc+=T*al*vec3((1.-f)*sun/2.3,(1.-f)*amb,f);\n          T*=1.-al;\n        }\n      }\n      if(T<.012)break;\n    }\n    s*=k;\n  }\n  if(T>.012){\n    float sc=2.*9./(d.y+sqrt(d.y*d.y+4.*a*9.));\n    vec2 q=(d*sc).xz-uCT.xy*7.5;\n    float ci=texture2D(uWx,q/110.).a*.62+texture2D(uWx,q/31.+.37).a*.38;\n    float f=1.-exp(-sc/70.);\n    float al=smoothstep(.55,.85,ci)*.42*smoothstep(.05,.6,uWeather);\n    acc+=T*al*vec3((1.-f)*ph*.8/2.3,1.-f,f);\n    T*=1.-al;\n  }\n  gl_FragColor=vec4(acc,1.-T);\n}\n",
"cloudfield": "uniform sampler2D uN3,uWx;uniform vec4 uCT,uEvo;uniform float uWeather;\nconst float I2R={{I2R}},HB=.8,HT=7.2,SIG=11.,SIGL=5.;\nvec4 n3(vec3 p){\n  p=fract(p);\n  float z=p.z*64.,z0=floor(z),z1=mod(z0+1.,64.);\n  vec2 xy=1.+p.xy*64.;\n  return mix(texture2D(uN3,(vec2(mod(z0,8.),floor(z0/8.))*66.+xy)/528.),texture2D(uN3,(vec2(mod(z1,8.),floor(z1/8.))*66.+xy)/528.),z-z0);\n}\nvec2 weather(vec3 p){\n  vec4 wx=texture2D(uWx,(p.xz-uCT.xy)/64.);\n  float far=length(p.xz);\n  float lane=max(smoothstep(.90,.975,dot(p.xz,{{LANE}})/max(far,.001)),smoothstep(.90,.975,dot(p.xz,{{LANE2}})/max(far,.001)))*smoothstep(4.,9.,far);\n  float tall=smoothstep(mix(.95,.60,uWeather),mix(1.06,.74,uWeather),wx.g)*(1.-lane);\n  return vec2(max(smoothstep(mix(.78,.36,uWeather),mix(1.,.82,uWeather),wx.r)*smoothstep(0.,.12,uWeather)*.52*(1.-.8*smoothstep(20.,50.,far))*(1.-.75*lane),tall*.95),\n              HB+mix(.6+1.5*wx.b,3.4+3.0*wx.b,smoothstep(0.,.3,tall)));\n}\nvec2 cloud(vec3 p,vec2 w,float fine){\n  float h=p.y+dot(p.xz,p.xz)*I2R,hn=(h-HB)/(w.y-HB);\n  if(hn<=0.||hn>=1.)return vec2(0.);\n  float c=w.x*smoothstep(0.,.07,hn)*(1.-.9*smoothstep(mix(.2,.5,smoothstep(2.5,4.,w.y)),1.,hn));\n  vec3 sp=vec3(p.xz-uCT.xy+uEvo.xy,h*.7)/6.;\n  float d=(n3(sp).r-(1.-c))/max(c,.05);\n  if(d<=0.)return vec2(0.);\n  if(fine>.5){\n    vec3 dp=vec3(sp.xy,h/6.)*2.1;dp.z-=uEvo.w;\n    float hf=n3(dp).g*.72+n3(dp*3.7).g*.28;\n    float er=mix(hf,1.-hf,clamp(hn*5.,0.,1.))*.62;\n    d=(d-er)/(1.-er);\n  }\n  return vec2(clamp(d*2.5,0.,1.),hn);\n}\n",
"cloudshade.frag": "uniform vec3 uLight;uniform vec2 uCRes;uniform float uStrength;\n#include \"noise\"\n#include \"cloudfield\"\nvoid main(){\n  vec2 g=(gl_FragCoord.xy/uCRes-.5)*{{SPAN}};\n  float ly=max(uLight.y,.06),ds=(4.2-HB)/ly/14.,tau=0.;\n  vec3 o=vec3(g.x,0.,g.y)+uLight*(HB/ly);\n  for(int i=0;i<14;i++){vec3 p=o+uLight*(ds*(float(i)+.5));tau+=cloud(p,weather(p),0.).x*ds;}\n  gl_FragColor=vec4(mix(1.,exp(-tau*2.6),uStrength),0.,0.,1.);\n}\n",
"flame.frag": "uniform float uTime;varying vec2 vUv;\n#include \"noise\"\nvoid main(){float y=vUv.y,x=(vUv.x-.5)*2.;\n  float n=fbm(vec2(x*1.8,y*2.4-uTime*2.2));float n2=noise(vec2(x*4.+3.,y*5.-uTime*3.6));\n  x+=(n-.5)*.6*y;\n  float n3=noise(vec2(x*7.-1.,y*4.5-uTime*4.6));float shape=(1.-y)*(.66+.7*n)-abs(x)*(1.45+1.2*y)-.10+(n2-.5)*.45*y+(n3-.5)*.4*(y+.15);\n  float f=smoothstep(0.,.26,shape)*smoothstep(0.,.07,y);\n  float core=smoothstep(.34,.80,shape);\n  vec3 col=mix(vec3(.85,.12,.02),vec3(1.,.55,.10),smoothstep(.1,.9,f));col=mix(col,vec3(1.,.93,.70),core);\n  gl_FragColor=vec4(col*f*1.2,f);}\n",
"flame.vert": "varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}\n",
"lagband.vert": "uniform float uTime,uLevel,uWind;varying vec3 vW;varying vec3 vN;varying vec3 vWave;\n#include \"noise\"\n#include \"island\"\n#include \"lagwave\"\nfloat bandH(vec2 p){\n  float r=length(p),th=atan(p.y,p.x);\n  float v=max(r-islandR(th)+landW(th),20.-length(p-vec2(sandbankX(),sandbankZ())));\n  float d=max(uLevel-hgt(p.x,p.y),0.);\n  vec3 lw=lagWave(p,d,uTime);float s=lw.x/LW_T;\n  float crest=lw.y*pow(max(1.-smoothstep(0.,.5,s),1e-4),1.6)+lw.z*pow(max(smoothstep(.62,1.,s),1e-4),2.2);\n  float trough=-.11*(lw.y+lw.z)*sin(3.1416*s);\n  float shoal=(1.+.45*(1.-smoothstep(.25,1.1,d)))*mix(.3,1.,smoothstep(0.,.3,d));\n  float edge=smoothstep(-13.,-8.5,v)*(1.-smoothstep(.3,2.3,v))*(1.-smoothstep(110.,145.,length(cameraPosition-vec3(p.x,uLevel,p.y))));\n  float amp=.52*lagEx(p)*lagHi()*shoal;\n  return edge*(.5*(1.-exp(-amp*.7*crest/.5))+amp*trough);\n}\nvoid main(){vec4 wp=modelMatrix*vec4(position,1.);vec2 p=wp.xz;\n  float h0=bandH(p),hx=bandH(p+vec2(.15,0.)),hz=bandH(p+vec2(0.,.15));\n  float c=clamp(h0,-.5,1.2),ok=(abs(c-h0)<1e-5)?1.:0.;\n  vec3 n=vec3(-(hx-h0)/.15,1.,-(hz-h0)/.15);float nok=(abs(n.x)+abs(n.z)<20.)?ok:0.;\n  wp.y=uLevel+c*ok;\n  vN=normalize(vec3(n.x*nok,1.,n.z*nok));\n  vWave=vec3(0.,200.,0.);\n  vW=wp.xyz;gl_Position=projectionMatrix*viewMatrix*wp;}\n",
"lagwave": "const vec2 WIND_DIR={{WINDDIR}};\nconst float LW_T=2.1;\nfloat lagHi(){return smoothstep(.7,1.,uWind);}\nfloat lagEx(vec2 p){\n  float r=length(p);\n  return mix(.6,clamp(.55+.6*dot(WIND_DIR,p/max(r,1.)),.2,1.),smoothstep(40.,80.,r));\n}\nfloat lagExposure(vec2 p){return lagEx(p)*(smoothstep(.4,.66,uWind)+1.3*lagHi());}\nvec3 lagWave(vec2 p,float d,float t){\n  float tau=4.56*(sqrt(clamp(d,0.,.69)+.04)-.2)+max(d-.69,0.)*2.75;\n  float ph=(t+tau)/LW_T-dot(p,WIND_DIR)*.06+1.3*noise(p*.045)+.15*(noise(p*1.9)-.5),n=floor(ph);\n  vec2 nn=vec2(n,n+1.),g=mix(vec2(1.),.95+.3*sin(nn*1.93)+.25*sin(nn*.71+2.),lagHi());\n  return vec3((ph-n)*LW_T,smoothstep(.34,.62,noise(p*.16+n*vec2(5.3,2.1)))*g.x,smoothstep(.34,.62,noise(p*.16+(n+1.)*vec2(5.3,2.1)))*g.y);\n}\nfloat lagFoam(float u,float sz){return smoothstep(.06,.28,sz)*max(1.-smoothstep(0.,.3,u),.8*exp(-u/(.7+.25*min(sz,2.))));}\n",
"noise": "float hash(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}\nvec2 hash2(vec2 p){vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));p3+=dot(p3,p3.yzx+33.33);return fract((p3.xx+p3.yz)*p3.zy)*2.-1.;}\nfloat noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*f*(f*(f*6.-15.)+10.);\n  float a=dot(hash2(i),f),b=dot(hash2(i+vec2(1.,0.)),f-vec2(1.,0.)),c=dot(hash2(i+vec2(0.,1.)),f-vec2(0.,1.)),d=dot(hash2(i+vec2(1.,1.)),f-vec2(1.,1.));\n  return clamp(mix(mix(a,b,u.x),mix(c,d,u.x),u.y)*.75+.5,0.,1.);}\nfloat fbm(vec2 p){float v=0.,a=.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<3;i++){v+=a*noise(p);p=m*p+vec2(3.1,1.7);a*=.5;}return v/.875;}\nfloat fbm5(vec2 p){float v=0.,a=.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<5;i++){v+=a*noise(p);p=m*p+vec2(3.1,1.7);a*=.5;}return v/.96875;}\n",
"rock_color": "vec3 rp=vRp,rn=normalize(vRn),tw=rn*rn;\nvec4 dA=texture2D(uDet,rp.zy*{{SCALE}})*tw.x+texture2D(uDet,rp.xz*{{SCALE}})*tw.y+texture2D(uDet,rp.xy*{{SCALE}})*tw.z;\nvec2 fq=vec2({{SCALE}}*3.7,.31);\nvec4 dB=texture2D(uDet,rp.zy*fq.x+fq.y)*tw.x+texture2D(uDet,rp.xz*fq.x+fq.y)*tw.y+texture2D(uDet,rp.xy*fq.x+fq.y)*tw.z;\nvec3 base=vColor*(.66+.68*dA.b);\nbase*=1.+(dB.r-.5)*{{BUMP}}+(dB.b-.5)*.30;\nbase*=1.-{{CRACK}}*smoothstep(.86,.98,dA.a)*smoothstep(.42,.62,dA.b);\nbase*=1.-{{PIT}}*smoothstep(.34,.16,dB.b)*(.4+.6*dA.b);\nfloat hsea=rp.y-uLevel;\nbase=mix(base,vec3(.72,.70,.66)*(.75+.5*dB.b),{{BLEACH}}*smoothstep(.2,.85,rn.y)*smoothstep(.25,1.1,hsea)*smoothstep(.3,.75,dA.b));\nfloat band=smoothstep(.80,.45,hsea)*smoothstep(-.35,.1,hsea);\nbase=mix(base,vec3(.80,.78,.72),band*smoothstep(.58,.72,dB.b)*smoothstep(.35,.6,dA.b)*{{BARNACLE}});\nbase=mix(base,base*vec3(.62,.66,.58),smoothstep(.30,.02,hsea)*(.4+.6*smoothstep(-.9,-.2,hsea)));\ndiffuseColor.rgb=seaTint(base,rp,clamp(rn.y,0.,1.),1.);\n",
"rock_pre": "uniform float uLevel,uDay,uTime,uWind;uniform sampler2D uDet;varying vec3 vRp;varying vec3 vRn;\n",
"seatint": "vec3 seaTint(vec3 c,vec3 wp,float up,float k){\n  float dw=max(uLevel-wp.y-.2,0.),sub=step(.0001,dw);\n  vec3 o=mix(c,vec3(dot(c,vec3(.3,.5,.2)))*vec3(1.04,1.04,1.02),.4*k*smoothstep(0.,.5,dw));\n  o*=mix(1.,.87,smoothstep(0.,.7,dw))*exp(-dw*k*vec3(.36,.085,.045));\n  o+=vec3(0.,.075,.13)*(1.-exp(-dw*.9))*uDay*(.4+.6*k);\n  vec2 cq=wp.xz*.34+vec2(uTime*.010,uTime*.006);vec2 cw=(texture2D(uDet,cq*.31+vec2(uTime*.017,-uTime*.013)).rg-.5)*.16;\n  float c1=texture2D(uDet,cq+cw).a,c2=texture2D(uDet,vec2(cq.x*.6+cq.y*.8,-cq.x*.8+cq.y*.6)*1.63-cw*1.4).a;\n  float ca=c1*c1;ca*=ca*c1;float ca2=c2*c2;ca2*=ca2;\n  o*=1.+(ca*1.7+ca2*1.3-.22)*smoothstep(.1,.8,dw)*exp(-(dw+.2)*.28)*uDay*(.35+.65*up)*smoothstep(0.,.45,uWind);\n  return mix(c,o,sub);\n}\n",
"sky.frag": "uniform float uTime,uNight,uDay,uUnder;uniform vec3 uSunDir,uSunCol,uTop,uHor,uFogC;uniform sampler2D uCloudA,uCloudB;uniform vec4 uCloudShift;uniform float uCloudMix;uniform vec3 uCloudSun,uCloudShd;varying vec3 vDir;\n#include \"noise\"\nvec4 cloudAt(sampler2D tex,vec3 d,vec2 shift){\n  float dy=max(d.y,0.),a=(1.-dy*dy)*{{I2R}};\n  vec3 p=d*(2.*{{REF}}/(dy+sqrt(dy*dy+4.*a*{{REF}})));\n  p.xz-=shift;p.y={{REF}}-dot(p.xz,p.xz)*{{I2R}};\n  vec3 dd=normalize(p);\n  vec2 uv=vec2(atan(dd.z,dd.x)/6.28318+.5,-.5+sqrt(.25+2.*asin(clamp(dd.y,0.,1.))/1.5708));\n  return .5*(texture2D(tex,uv+{{HALF}})+texture2D(tex,uv-{{HALF}}));\n}\nvoid main(){vec3 d=normalize(vDir);float sy=clamp(d.y,0.,1.);\n  vec3 sky=mix(uHor,uTop*(1.-.22*sy),pow(sy,.5));float vis=1.-uNight;\n  vec2 dnh=normalize(d.xz+1e-5);float toSun=dot(dnh,normalize(uSunDir.xz+1e-5));\n  sky+=vec3(.10,.08,.05)*uDay*smoothstep(-.2,1.,toSun)*exp(-sy*5.);\n  float eve=smoothstep(.40,1.,1.-uDay)*vis;\n  float gold=smoothstep(.15,.5,1.-uDay)*(1.-eve)*vis;\n  sky=mix(sky,vec3(1.,.80,.52),gold*(.25+.35*smoothstep(-.4,1.,toSun))*exp(-sy*3.2));\n  sky+=vec3(.95,.34,.10)*eve*smoothstep(-.3,1.,toSun)*exp(-sy*6.)*.55;\n  sky=mix(sky,vec3(.56,.40,.62),eve*smoothstep(.3,-.9,toSun)*exp(-sy*5.)*.65);\n  sky=mix(sky,vec3(.98,.60,.55),eve*exp(-pow((sy-.16)/.12,2.))*.28);\n  float ang=sqrt(max(0.,2.-2.*dot(d,uSunDir)));\n  sky+=uSunCol*(.28*exp(-ang*3.5)+.5*exp(-ang*16.))*vis;\n  sky=mix(sky,uSunCol*1.5+.3,smoothstep(.034,.026,ang));\n  if(uNight>.004){\n  vec3 sp=d*180.;vec3 g=floor(sp);vec3 sf=fract(sp)-.5;\n  float sh=hash(g.xy+g.z*vec2(17.3,31.7));\n  float st=step(.9975,sh)*smoothstep(.45,.05,length(sf))*uNight*smoothstep(0.,.2,d.y);\n  sky+=st*(.7+.3*sin(uTime*2.+g.x+g.z))*1.4;\n  vec3 mwn=normalize(vec3(.35,.5,-.79));float mwd=dot(d,mwn)*3.2;float band=exp(-mwd*mwd);\n  float mwf=fbm5(d.xz*3.+d.y*2.5);\n  sky+=uNight*band*(.25+.75*mwf)*smoothstep(-.05,.3,d.y)*vec3(.15,.17,.26);\n  vec3 g2=floor(d*420.);\n  sky+=step(.9965-.006*band*mwf,hash(g2.xy+g2.z*vec2(13.1,29.7)))*uNight*smoothstep(0.,.2,d.y)*.32;\n  float ts=uTime*.12;float sid=floor(ts);float tt=fract(ts)*6.;\n  vec3 so=normalize(vec3(hash(vec2(sid,1.))-.5,.45+.4*hash(vec2(sid,2.)),hash(vec2(sid,3.))-.5));\n  vec3 sv=normalize(vec3(hash(vec2(sid,4.))-.5,-.25,hash(vec2(sid,5.))-.5));\n  vec3 hp=normalize(so+sv*tt*.35);vec3 dh=d-hp;float along=dot(dh,-sv);float perp=length(cross(dh,sv));\n  sky+=smoothstep(.0045,0.,perp)*smoothstep(.13,0.,along)*step(0.,along)*step(tt,1.)*uNight*vec3(1.,.95,.8)*1.6;\n  vec3 md=normalize(vec3(-.57,.63,-.52));float ma=sqrt(max(0.,2.-2.*dot(d,md)));\n  sky+=uNight*(vec3(.92,.95,1.)*smoothstep(.042,.034,ma)+vec3(.20,.26,.42)*exp(-ma*8.));\n  }\n  if(d.y>-.012){\n    vec4 ck=mix(cloudAt(uCloudA,d,uCloudShift.xy),cloudAt(uCloudB,d,uCloudShift.zw),uCloudMix)*smoothstep(-.012,.004,d.y);\n    vec3 sunc=uCloudSun*mix(vec3(.95,.66,.58),vec3(1.),clamp(uDay*2.2+smoothstep(.04,.26,asin(clamp(d.y,0.,1.))),0.,1.));\n    sky=sky*(1.-ck.a+ck.b)+sunc*ck.r*mix(2.4,1.85,uDay)+uCloudShd*ck.g*.82;\n  }\n  sky=mix(sky,uHor,smoothstep(.07,0.,d.y)*.55);\n  sky=mix(sky,uFogC,uUnder);\n  sky+=(hash(gl_FragCoord.xy)-.5)*(2./255.);\n  gl_FragColor=vec4(sky,1.);}\n",

"terrain_color": "float th=vWp.y;vec2 tp=vWp.xz;\nfloat lagA=atan(tp.y,tp.x),lagK=1.-smoothstep(-.7,-.4,(length(tp)-islandR(lagA))/(26.+44.*pow(.5+.5*sin(lagA),1.6)+4.*sin(5.*lagA+1.)));\nfloat cdist=length(uCam-vWp);float nf=exp(-cdist*.05);\nfloat dep=max(uLevel-th,0.);\nvec2 cq=tp*.34+vec2(uTime*.010,uTime*.006);\nvec2 cw=(texture2D(uDet,cq*.31+vec2(uTime*.017,-uTime*.013)).rg-.5)*.16;\nfloat grit=((texelColor.g-uGritMean)*exp(-cdist*.02)+(texture2D(map,vUv*.23+.37).g-uGritMean)*.10*exp(-cdist*.006))*(1.-.75*smoothstep(0.,.5,dep));\nvec2 caus=vec2(texture2D(uDet,cq+cw).a,texture2D(uDet,vec2(cq.x*.6+cq.y*.8,-cq.x*.8+cq.y*.6)*1.63-cw*1.4).a);\nif(dep>8.6){\n  diffuseColor.rgb=vec3(.77,.72,.61);\n}else{\n  float macro=fbm(tp*.11);\n  vec2 sunXZ=normalize(uSunDir.xz+1e-4)*(1.-.45*uSunDir.y);\n  float zw=noise(tp*.23+7.)-.5;\n  float loose=smoothstep(.30,.62,th+zw*.2)*(1.-smoothstep(1.75,2.1,th));\n  vec3 sand=mix(vec3(.725,.715,.69),vec3(.71,.71,.70),smoothstep(.35,.7,macro))*(.94+.12*macro)*(.97+.06*fbm(tp*1.9));\n  vec4 r1=texture2D(uDet,tp*.06);\n  float trod=.35+.65*smoothstep(.3,.6,noise(tp*.09+50.));\n  float relief=0.;\n  if(loose>.001){\n    float dmp=0.,rpl=0.;\n    if(cdist<120.)dmp=(dimples(tp*1.5,sunXZ)+dimples(vec2(tp.x*.6-tp.y*.8,tp.x*.8+tp.y*.6)*2.3+5.,sunXZ)+dimples(vec2(tp.x*.28+tp.y*.96,-tp.x*.96+tp.y*.28)*3.7+11.,sunXZ)*.7)*1.5*trod*exp(-cdist*.03);\n    if(cdist<90.)rpl=cos(dot(tp,vec2(.8,.6))*13.+4.*noise(tp*.5))*dot(sunXZ,vec2(.8,.6))*.07*(1.-trod)*exp(-cdist*.05);\n    relief=(dmp\n               +rpl\n               +dot(r1.rg-.5,sunXZ)*.14*exp(-cdist*.010))*loose;\n  }\n  sand*=1.+relief;sand=mix(sand,sand*vec3(.88,.95,1.06),clamp(-relief*4.,0.,1.));\n  float shoreK=smoothstep(-.3,.0,th);\n  float soaked=(1.-smoothstep(.03,.30,th+zw*.14))*shoreK;\n  float damp=(1.-smoothstep(.22,.60,th+zw*.28+(noise(tp*1.3)-.5)*.16))*shoreK;\n  float lap=.035+.028*sin(uTime*1.25+6.*noise(tp*.13))+.012*sin(uTime*2.7+tp.x*.9+tp.y*.7)+.02*(noise(tp*.9)-.5);\n  f ;\n    float bare=smoothstep(.56,.70,fbm(tp*.33+40.)+.25*(noise(tp*2.7)-.5));\n    gg=mix(gg,vec3(.80,.73,.56)*(.85+.3*noise(tp*5.)),bare*.85);\n    vec3 soil=vec3(.50,.38,.25)*(.75+.5*fbm(tp*1.3));\n    soil*=1.-.25*step(.975,hash(floor(tp*18.)+9.))*smoothstep(.5,.2,length(fract(tp*18.)-.5))*nf;\n    float dirtA=sin(tp.x*.23+1.1*sin(tp.y*.17))*sin(tp.y*.21+1.4*sin(tp.x*.19)+2.);\n    float dm=smoothstep(.66,.80,dirtA+(fbm(tp*.6)-.5)*.5+(noise(tp*3.1)-.5)*.12);\n    float lit2=smoothstep(.35,.7,fbm(tp*.35+70.));\n    gg=mix(gg,vec3(.50,.40,.25)*(.7+.6*noise(tp*4.3)),lit2*.45);\n    vec3 land=mix(gg,soil,dm*.85);\n    float pm=smoothstep(1.05,.72,pathD(tp)+(noise(tp*.9)-.5)*.7+(noise(tp*4.)-.5)*.25);\n    vec3 pathc=mix(soil,vec3(.80,.70,.50),.55)*(.9+.2*noise(tp*3.));\n    land=mix(land,pathc,pm);\n    float rk=smoothstep(10.6,12.6,th+(noise(tp*.5)-.5)*2.);\n    land=mix(land,vec3(.46,.44,.39)*(.7+.6*fbm(tp*1.5)),rk);\n    float edgeW=.45*sin(tp.x*.31+tp.y*.17)+.3*sin(tp.y*.43-tp.x*.23+1.);\n    float gline=th+edgeW+(fbm(tp*1.7)-.5)*.5;\n    float back=smoothstep(1.15,1.65,gline);\n    vec3 fringe=mix(sand,sand*vec3(.86,.82,.74),back*(.55+.45*smoothstep(.3,.7,noise(tp*.31+9.))));\n    float litter=0.;\n    if(back>.001&&cdist<150.)litter=max(fleck(tp*6.),fleck(vec2(tp.x*.8+tp.y*.6,-tp.x*.6+tp.y*.8)*9.+3.))*back*smoothstep(.2,.55,noise(tp*.6+17.))*exp(-cdist*.025);\n    fringe=mix(fringe,vec3(.34,.25,.15)*(.7+.6*hash(floor(tp*6.))),litter*.85);\n    float patchy=gline+(fbm(tp*.9+3.)-.5)*1.3+(noise(tp*3.3)-.5)*.30;\n    float gm=smoothstep(1.74,1.84,patchy);\n    fringe=mix(fringe,vec3(.52,.45,.34)*(.85+.3*noise(tp*4.)),smoothstep(1.45,1.74,patchy)*.7);\n    float rub=smoothstep(.95,1.3,gline)*smoothstep(.42,.6,fbm(tp*.5+13.));\n    vec3 rubc=vec3(.74,.72,.67)*(.9+.2*noise(tp*9.));\n    if(rub>.002&&nf>.02){\n    vec3 pb=pebble(vec2(tp.x*.5+tp.y*.87,-tp.x*.87+tp.y*.5)*15.+7.,sunXZ,.55);\n    rubc=mix(rubc,mix(vec3(.56,.55,.52),vec3(.92,.90,.86),pb.z)*pb.y,pb.x);\n "terrain_pre": "uniform float uTime,uLevel,uDay,uGritMean,uWind;uniform vec3 uCam,uSunDir;uniform vec3 uHor;uniform sampler2D uDet,uCloudShade,uReef;varying vec3 vWp;\n#include \"terrain_fn\"\n#include \"shore\"\n#include \"lagwave\"\nfloat fleck(vec2 p){\n  vec2 ci=floor(p),d=fract(p)-(vec2(hash(ci+13.),hash(ci+29.))*.6+.2);\n  float a=hash(ci+41.)*6.283;\n  d=vec2(d.x*cos(a)+d.y*sin(a),(-d.x*sin(a)+d.y*cos(a))*(2.5+3.*hash(ci+53.)));\n  return smoothstep(.22,.12,length(d))*step(.45,hash(ci+61.));\n}\nvec3 pebble(vec2 p,vec2 L,float dens){\n  vec2 ci=floor(p),c=vec2(hash(ci+3.),hash(ci+8.))*.5+.25,d=fract(p)-c;\n  float rad=.07+.18*hash(ci+15.)*hash(ci+27.);\n  float a=hash(ci+33.)*3.1416,ca=cos(a),sa=sin(a);\n  vec2 e=vec2(d.x*ca+d.y*sa,(-d.x*sa+d.y*ca)*(1.+.9*hash(ci+39.)));\n  float r=mix(length(e),(abs(e.x)+abs(e.y))*.8,.75*hash(ci+45.))/rad;\n  return vec3(smoothstep(1.,.78,r)*step(1.-dens,hash(ci+21.)),.82+.42*dot(d,L)/rad+.12*(1.-r),hash(ci+51.));\n}\nfloat dimples(vec2 p,vec2 L){\n  vec2 ci=floor(p),c=vec2(hash(ci+3.),hash(ci+11.))*.44+.28;\n  float rad=.20+.20*hash(ci+7.);\n  vec2 d=(fract(p)-c)/rad;\n  float a=hash(ci+23.)*3.1416,ca=cos(a),sa=sin(a);\n  vec2 e=vec2(d.x*ca+d.y*sa,(-d.x*sa+d.y*ca)*(1.+.9*hash(ci+37.)));\n  float w=max(1.-dot(e,e),0.);\n  return -dot(d,L)*w*sqrt(w)*step(.3,hash(ci+19.))*(.35+.65*hash(ci+43.));\n}\n",
"water.frag": "uniform float uTime,uNight,uDay,uLevel,uUnder,uDbg;uniform vec3 uSunDir,uSunCol,uTop,uHor,uFogC;uniform float uFar;uniform vec3 uObs[16];\nuniform sampler2D uDet,uCloudA,uCloudB,uCloudShade,uReef;uniform float uCloudMix,uSunThru,uWind,uBand,uBandOn;uniform vec3 uCloudSun,uCloudShd;\nvarying vec3 vW;varying vec3 vN;varying vec3 vWave;\n#include \"noise\"\n#include \"island\"\n#include \"lagwave\"\nvec2 horse(vec2 pw,float wrp,float rag,float fat,vec2 dir,float lam,float c,float t,float seed,float thr,vec2 v,float rise,float fp,float flatW){\n  float x=(dot(pw,dir)+wrp-c*t)/lam,sd=dot(v,vec2(-dir.y,dir.x)),al=dot(pw,vec2(-dir.y,dir.x))*.075;vec2 o=vec2(0.);\n  if(flatW>.01){\n    float n=ceil(x),q=n-x,age=q*lam/c,nb=mod(n,1024.);\n    float g=smoothstep(thr,thr+.1,noise(vec2(nb*7.31+seed+(t-age)*.6,al+nb*3.7))+rag);\n    o.x=g*max(1.-smoothstep(.2*fat,(.7+5.*max(rag+.08,0.))*fat,q*lam),.36+.2*exp(-age/2.2))*(1.-smoothstep(.72,.97,q))*smoothstep(0.,max(fp*1.2,1e-4),q)*flatW;\n  }\n  float k=dot(v,dir),ak=abs(k);\n  if(ak>.06){\n    float L=max(log2(fp/.16),0.),S=exp2(floor(L)),xs=x/S,up=step(k,0.),n=ceil(xs),q=n-xs,rb=mix(1.-q,q,up);\n    float pix=fp/S*1.25,top=rise*ak/(lam*S);\n    if(rb<min(max(top,pix),.5)){\n      float nc=n-1.+up,nb=mod(nc*S,1024.);\n      float as=al-rb*lam*S/ak*sd*.075,tf=thr-.05*min(L,3.),g=smoothstep(tf,tf+.1,noise(vec2(nb*7.31+seed+t*.6,as+nb*3.7)));\n      g=smoothstep(.1,.6,g)*(.65+.35*sin(as*31.+nb)*sin(as*13.7+1.3*nb));\n      float band=top*mix(.75,1.,up)*g,be=min(max(band,pix),.5);\n      o.y=(1.-smoothstep(.35*be,be,rb))*pow(min(1.,band/pix),.6)*mix(1.,1.-fract(L),mod(nc,2.))*smoothstep(.06,.22,ak)*smoothstep(0.,min(pix*.8,be*.3),rb);\n    }\n  }\n  return o;\n}\nvoid main(){vec2 p=vW.xz,dpx=dFdx(vW.xz),dpy=dFdy(vW.xz);\n  vec3 toC=cameraPosition-vW;float dist=length(toC);vec3 V=toC/dist;\n  float lagoon=0.;\n  if(uFar>.5){float th0=atan(p.y,p.x),Rs=islandR(th0),rp=length(p);if(rp<Rs+93.&&rp>Rs-8.6)discard;lagoon=step(r /* ---- generated from src/shared/island.glsl (edit that file, not this) ---- */
function landW(th){
  return 26.+44.*Math.pow(.5+.5*Math.sin(th),1.6)+4.*Math.sin(5.*th+1.);
}
function smin(a,b,k){
  var h=Math.max(k-Math.abs(a-b),0.)/k;
  return Math.min(a,b)-h*h*k*.25;
}
function sandbankX(){return 4.;}
function sandbankZ(){return -8.;}
function hgt(x,z){
  var r=Math.sqrt(x*x+z*z),th=Math.atan2(z,x);
  var s=r-islandR(th);
  var v=s+landW(th);
  var vm=Math.min(v,0.);
  var mask=Math.min(-vm/25.,1.);
  var reef=Math.min(7.*Math.max(Math.sin(x*.09+1.3)*Math.sin(z*.085+.4)-.4,0.),3.4)*mask;
  var hl=.2*Math.max(v,0.)-6.5*(1.-Math.exp(vm/24.))+reef;
  var cap=2.9+.5*Math.sin(x*.13+1.)*Math.sin(z*.11)+.35*Math.sin(x*.31)*Math.cos(z*.27);
  var land=smin(smin(shoreH(x,z),cap,.5),hl,.5);
  var t=Math.min(Math.max((s-46.)/18.,0.),1.);
  var shelf=-1.15-.012*Math.max(s,0.)-9.*t*t*(3.-2.*t)+.1*Math.sin(x*.6+z*.3)*Math.sin(z*.7)-2.*Math.max(-5.-s,0.)-3.*passChannel(th,r,0.);
  var dx=x-sandbankX(),dz=z-sandbankZ();
  var bank=2.2*(1.-(dx*dx+dz*dz)/400.);
  return Math.max(Math.max(Math.max(land,shelf),bank),-9.5);
}

/* ---- generated from src/shared/shore.glsl (edit that file, not this) ---- */
function islandR(th){
  return 150.-18.*Math.cos(2.*th)+9.*Math.sin(3.*th+1.)+5.*Math.sin(5.*th);
}
function passGapAt(th,bias){
  var t=Math.min(Math.max((.5-.5*Math.sin(th)+bias-.875)/.075,0.),1.);
  return t*t*(3.-2.*t);
}
function passGap(th){
  return passGapAt(th,0.);
}
function passChannel(th,r,bias){
  var t=Math.min(Math.max((.5+.5*Math.cos(th-4.45-.05*Math.sin(r*.05))+bias-.99314)/.00564,0.),1.);
  return t*t*(3.-2.*t);
}
function openSea(th){
  var t=Math.min(Math.max((.5+.5*Math.cos(th-4.45)-.96025)/.02271,0.),1.);
  return 1.-t*t*(3.-2.*t);
}
function shoreH(x,z){
  var r=Math.sqrt(x*x+z*z),th=Math.atan2(z,x);
  var s=r-islandR(th);
  var u=Math.max(1.+s/55.,.2);
  var e=2.*Math.min(Math.max(-s/26.,0.),1.)-1.;
  var g=passGapAt(th,.075*e*e+.014*Math.sin(x*.19+z*.23));
  var top=4.8-g*(4.25+.22*Math.sin(th*23.+2.));
  return Math.min(5.*(1.-u*u),top)+.35*Math.sin(x*.31)*Math.cos(z*.27)*(1.-.65*g)-3.9*passChannel(th,r,.009*e*e+.0015*Math.sin(x*.23-z*.19));
}

/* The swell: three wave trains wrapped around the island. For each train
     om  angular frequency in rad/s (period = 2*pi/om seconds)
     m   how many crests fit around the island; the sign is the way the pattern turns
     ph  phase offset
     A   amplitude in metres in deep water (the south side gets all of it, the sheltered north side about two thirds)
     g   how quickly the train swells and fades (this is what makes sets)
     c   offset that makes wave size differ from crest to crest and along a crest
     ru  how far its swash runs up the beach, relative to the others
     cu  1 = may plunge with a falling lip when steep enough, 0 = always spills
   The shader (src/glsl/waves.glsl) and its JavaScript copy (36_waves.js) both read this table. */
var WAVE_TRAINS=[
  {om:1.21,m:5,ph:0.0,A:0.46,g:0.090,c:0.0,ru:0.14,cu:1},
  {om:1.61,m:-7,ph:2.1,A:0.13,g:0.117,c:2.1,ru:0.10,cu:0},
  {om:0.885,m:3,ph:4.2,A:0.30,g:0.144,c:4.2,ru:0.12,cu:1}
];

   about 3 m outside it and the biggest about 8 m outside, right on top of the drop-off. */

/* Random numbers, seeded, so the island is identical on every load and a screenshot or bug report always refers to
   the same rock. Each part that scatters things draws from its OWN stream - rndStream('palms'), rndStream('rocks') -
   so changing how one kind of thing is placed does not move all the others. rnd() is the general stream, for effects
   while the scene runs (spray). */
function rndStream(name){
  var state=(window.__seed||WORLD_SEED)>>>0;   /* window.__seed: test hook for trying other layouts */
  for(var i=0;i<name.length;i++)state=Math.imul(state^name.charCodeAt(i),0x9E3779B1)>>>0;
  return function(){
    state=(state+0x6D2B79F5)|0;
    var t=Math.imul(state^(state>>>15),1|state);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
var rnd=rndStream('general');
function smoothstep(a,b,x){
  var t=Math.max(0,Math.min(1,(x-a)/(b-a)));
  return t*t*(3-2*t);
}
/* blend two [r,g,b] arrays */
function mix3(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
/* a number written the way GLSL wants a float ("2." rather than "2") */
function glslFloat(v){
  var t=(+v).toFixed(4);
  return t.indexOf('.')<0?t+'.':t;
}

/* ================= 20_glsl.js ================= */
/* Shader chunks live in src/glsl/*.glsl (and src/shared/*.glsl); the build embeds them as GLSL_SRC (name -> text).

   glsl(name)            the chunk with its  #include "other"  lines replaced by those chunks. A chunk is only ever
                         included once per call, so two chunks may both include a third.
   glslFill(name, vars)  fills the {{PLACEHOLDER}}s of a chunk, once, by whoever owns the numbers
                         (e.g. the wave trains are written into "waves" by 36_waves.js).

   three.js's own  #include <chunk>  lines use angle brackets and are left alone. */
function glsl(name,seen){
  seen=seen||{};
  if(seen[name])return '';
  seen[name]=true;
  var src=GLSL_SRC[name];
  if(src===undefined)throw new Error('missing shader chunk: '+name);
  var left=/\{\{(\w+)\}\}/.exec(src);
  if(left)throw new Error('shader chunk '+name+': placeholder {{'+left[1]+'}} was never filled in (glslFill)');
  return src.replace(/^[ \t]*#include "([\w.]+)"[ \t]*$/gm,function(_,n){return glsl(n,seen);});
}
function glslFill(name,vars){
  if(GLSL_SRC[name]===undefined)throw new Error('missing shader chunk: '+name);
  GLSL_SRC[name]=GLSL_SRC[name].replace(/\{\{(\w+)\}\}/g,function(_,k){
    if(!(k in vars))throw new Error('shader chunk '+name+': no value for {{'+k+'}}');
    return vars[k];
  });
}

        updGulls(t, dt); updFish(t); updCrabs(t, dt, pp); updTurtle(t, wl);
        updButter(t); bR.visible = bL.visible = env.day >= 0.3;
        updFlies(t, env.night); updDolphins(t, wl);
      } catch (e) { /* never throw */ }
    }
  };
}

/* ================= 54_modules.js ================= */
/* Props and wildlife are self-contained "modules": a function build(THREE, scene, moduleApi) that adds its objects and
   returns {update(t, dt, moduleEnv)}. moduleApi is what they may ask the world (ground height, positions of landmarks);
   moduleEnv is what they are told each frame. A module that throws is dropped; the rest of the scene carries on. */

var modules=[],moduleEnv={day:1,night:0,waterLevel:0,camera:camera,playerPos:camera.position};
var moduleApi={hgt:hgt,shoreZ:shoreZ,islandR:islandR,pier:{x:PIER_X,z0:PIER_Z0,len:PIER_LEN,deckTop:1.0,width:2.4},hut:{x:HUT_X,z:HUT_Z},home:{x:HOME_X,z:HOME_Z},fire:{x:FIRE_X,z:FIRE_Z}};
(CAMP?[buildProps,buildLife]:[buildLife]).forEach(function(build){
  try{
    var mo=build(THREE,scene,Object.assign({},moduleApi,{rnd:rndStream(build.name)}));   /* each module its own random stream */
    if(mo&&mo.update)modules.push(mo);
  }catch(e){console.log('module '+build.name+' failed: '+e.message);}
});

/* frame step: props and wildlife */
function updateModules(F){
  var t=F.t,dt=F.dt;
  moduleEnv.day=F.day;
  moduleEnv.night=F.night;
  moduleEnv.waterLevel=waveH(PIER_X+2.3,PIER_Z0+PIER_LEN-3,t);
  for(var mi=modules.length-1;mi>=0;mi--){
    try{modules[mi].update(t,dt,moduleEnv);}catch(er){
      console.log('module update failed: '+er.message);
      modules.splice(mi,1);
    }
  }
}

/* ================= 60_player.js ================= */
/* The player: position and view direction, walking / swimming / diving, the opening fly-in, place-name captions, input.
   player = {x,z,y} is the eye position; yaw and pitch the view direction; swimY the eye height while swimming. */

/* what the player stands on: the terrain */
function ground(x,z){
  return hgt(x,z);
}
var player={x:3,z:shoreZ(3,1.0)-1.5,y:3},yaw=Math.PI-0.75,pitch=-0.02,stickX=0,stickY=0,keys={},moved=false,bob=0;
var titleEl=document.getElementById('title'),capEl=document.getElementById('cap');
/* the opening fly-in: the camera travels from intro.A to wherever the player camera is */
var intro={t:0,dur:9,on:true,speed:1,A:new THREE.Vector3(),F:new THREE.Vector3(),qa:new THREE.Quaternion(),qb:new THREE.Quaternion()};
intro.A.set(player.x-150,205,player.z+225);
(function(){
  var ic=new THREE.PerspectiveCamera();
  ic.position.copy(intro.A);
  ic.lookAt(0,0,25);
  intro.qa.copy(ic.quaternion);
})();
document.body.classList.add('intro');
function skipIntro(){if(intro.on)intro.speed=5;}
/* place names shown when the player walks into a spot (index = what zoneAt() returns) */
var ZN=[['',''],['Campfire','warmer after dark'],['Shelter','a roof of fronds'],['The Lagoon','still water inside the ring'],['The Sandbank','you swam all this way'],['Open Water','the atoll looks small from here']];
var swimY=0.5,swimHint=false,capZone=-1,capTimer=0;
function zoneAt(x,z,sw,g){
  if(CAMP&&Math.hypot(x-FIRE_X,z-FIRE_Z)<3.2)return 1;
  if(CAMP&&Math.hypot(x-HUT_X,z-HUT_Z)<6.5)return 2;
  if(Math.hypot(x-sandbankX(),z-sandbankZ())<19&&g>0.3)return 4;
  if(sw){
    var r=Math.hypot(x,z),th=Math.atan2(z,x),R=islandR(th);
    if(r<R-landW(th)-8)return 3;
    if(r>R+75)return 5;
  }
  return -1;
}
/* ---------- input: on-screen stick, drag to look, keyboard ---------- */
var joy=document.getElementById('joy'),knob=document.getElementById('knob'),jid=null;
function jset(e){
  var r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
  var l=Math.hypot(dx,dy),mx=46;
  if(l>mx){
    dx*=mx/l;
    dy*=mx/l;
  }
  stickX=dx/mx;
  stickY=dy/mx;
  knob.style.transform='translate('+dx+'px,'+dy+'px)';
}
joy.addEventListener('pointerdown',function(e){
  skipIntro();
  jid=e.pointerId;
  try{joy.setPointerCapture(jid);}catch(_){}
  jset(e);
  if(!moved){
    moved=true;
    hintEl.style.opacity=0;
  }
  e.preventDefault();
});
joy.addEventListener('pointermove',function(e){if(e.pointerId===jid)jset(e);});
function jend(e){
  if(e.pointerId!==jid)return;
  jid=null;
  stickX=stickY=0;
  knob.style.transform='';
}
joy.addEventListener('pointerup',jend);
joy.addEventListener('pointercancel',jend);
var looks={};
canvas.addEventListener('pointerdown',function(e){
  skipIntro();
  looks[e.pointerId]={x:e.clientX,y:e.clientY};
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
});
canvas.addEventListener('pointermove',function(e){
  var l=looks[e.pointerId];
  if(!l)return;
  yaw-=(e.clientX-l.x)*0.0055;
  pitch-=(e.clientY-l.y)*0.0055;
  pitch=Math.max(-1.2,Math.min(1.2,pitch));
  l.x=e.clientX;
  l.y=e.clientY;
});
function lend(e){delete looks[e.pointerId];}
canvas.addEventListener('pointerup',lend);

window.addEventListener('keydown',function(e){
  skipIntro();

/* frame step: walking, swimming and diving, the opening fly-in, and the camera. Sets F.ground and F.swimming. */
function updatePlayer(F){
  var t=F.t,dt=F.dt;
  /* move */
  var mf=-stickY,mr=stickX;
  if(keys.w||keys.arrowup)mf=1;
  if(keys.s||keys.arrowdown)mf=-1;
  if(keys.a)mr=-1;
  if(keys.d)mr=1;
  if(keys.arrowleft)yaw+=dt*1.6;
  if(keys.arrowright)yaw-=dt*1.6;
  if(intro.on){
    mf=0;
    mr=0;
  }
  var g0=ground(player.x,player.z),swim=g0<-1.2,sp=swim?3.6:(g0<-0.2?4.2:6.5);
  var fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  player.x+=(fx*mf+rx*mr)*sp*dt;
  player.z+=(fz*mf+rz*mr)*sp*dt;
  var rr=Math.hypot(player.x,player.z);
  if(rr>420){
    player.x*=420/rr;
    player.z*=420/rr;
  }
  var mv=Math.min(1,Math.hypot(mf,mr));
  bob+=dt*mv*(swim?4:9);
  var g1=ground(player.x,player.z),ty;
  if(g1>-1.2){
    swimY=0.5;
    ty=g1+1.7+Math.sin(bob)*0.035*mv;
  }else{
    swimY=Math.max(g1+0.55,Math.min(0.5,swimY+Math.sin(pitch)*mf*sp*dt));
    ty=swimY+(swimY>0.2?waveH(player.x,player.z,t):0)+Math.sin(t*1.6)*(swimY>0.3?0.04:0.02);
    if(!swimHint&&!intro.on){
      swimHint=true;
      capEl.innerHTML='<b>Swimming</b><span>look down and push forward to dive</span>';
      capEl.style.opacity=1;
      capTimer=5;
    }
  }
  player.y+=(ty-player.y)*Math.min(1,dt*7);
  camera.position.set(player.x,player.y,player.z);
  camera.rotation.set(pitch,yaw,0);
  if(intro.on){
    intro.t+=dt*intro.speed;
    var ik=Math.min(1,intro.t/intro.dur);
    ik=ik*ik*ik*(ik*(ik*6-15)+10);
    intro.qb.copy(camera.quaternion);
    intro.F.copy(camera.position);
    camera.position.lerpVectors(intro.A,intro.F,ik);
    camera.position.y+=Math.sin(ik*Math.PI)*5;
    camera.quaternion.copy(intro.qa).slerp(intro.qb,ik);
    if(ik>0.5)titleEl.style.opacity=0;
    if(ik>=1){
      intro.on=false;
      document.body.classList.remove('intro');
    }
  }
  if(window.__fly){
    var fly=window.__fly;
    camera.position.set(fly[0],fly[1],fly[2]);
    camera.rotation.set(fly[4],fly[3],0);
  }
  F.ground=g1;
  F.swimming=g1<=-1.2;
}

/* frame step: place names that fade in when the player enters a named spot */
function updateCaptions(F){
  var dt=F.dt,g1=F.ground;
  var zn=intro.on?-1:zoneAt(player.x,player.z,g1<-1.2,g1);
  if(zn!==capZone){
    capZone=zn;
    if(zn>=0){
      capEl.innerHTML='<b>'+ZN[zn][0]+'</b><span>'+ZN[zn][1]+'</span>';
      capEl.style.opacity=1;
      capTimer=4.5;
    }
  }
  if(capTimer>0){
    capTimer-=dt;
    if(capTimer<=0)capEl.style.opacity=0;
  }
}

/* ================= 62_footprints.js ================= */
/* Footprints in dry sand (a ring buffer of instanced decals; the swash washes them away). */

var FPN=70,
    fpI=0,
    fpXZ=new Float32Array(FPN*2),
    fpH=new Float32Array(FPN),
    fpLast={x:player.x,z:player.z},
    fpSide=1,
    fpM=new THREE.Matrix4(),
    fpQ=new THREE.Quaternion(),
    fpE=new THREE.Euler(),
    fpS=new THREE.Vector3(1,1,1),
    fpP=new THREE.Vector3(),
    fpZero=new THREE.Matrix4().makeScale(0,0,0);
var fpG=new THREE.CircleGeometry(0.075,10);
fpG.rotateX(-Math.PI/2);
fpG.scale(1,1,1.9);
var fpMesh=new THREE.InstancedMesh(fpG,new THREE.MeshBasicMaterial({color:0x7a6646,transparent:true,opacity:0.34,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}),FPN);
(function(){
  for(var i=0;i<FPN;i++){
    fpMesh.setMatrixAt(i,fpZero);
    fpH[i]=99;
  }
})();
fpMesh.frustumCulled=false;
fpMesh.renderOrder=1;
scene.add(fpMesh);

/* frame step: lay a print every stride on dry sand; wash away prints the swash reaches */
function updateFootprints(F){
  var t=F.t,g1=F.ground;
  var fdx=player.x-fpLast.x,fdz=player.z-fpLast.z,fd=Math.hypot(fdx,fdz);
  if(fd>0.72){
    fpLast.x=player.x;
    fpLast.z=player.z;
    var fh=hgt(player.x,player.z);
    if(!intro.on&&fh>0.1&&fh<1.7&&g1===fh){
      fpSide=-fpSide;
      var fhx=fdx/fd,fhz=fdz/fd;
      fpP.set(player.x+fhz*0.13*fpSide,0,player.z-fhx*0.13*fpSide);
      fpP.y=hgt(fpP.x,fpP.z)+0.025;
      fpE.set(0,Math.atan2(fhx,fhz),0);
      fpQ.setFromEuler(fpE);
      fpM.compose(fpP,fpQ,fpS);
      fpMesh.setMatrixAt(fpI,fpM);
      fpH[fpI]=fpP.y;
      fpXZ[fpI*2]=fpP.x;
      fpXZ[fpI*2+1]=fpP.z;
      fpI=(fpI+1)%FPN;
      fpMesh.instanceMatrix.needsUpdate=true;
    }
  }
  for(var fi=0;fi<FPN;fi++)if(fpH[fi]<1.7&&(waveH(fpXZ[fi*2],fpXZ[fi*2+1],t),WP_Hr>WP_h+0.02)){
    fpH[fi]=99;
    fpMesh.setMatrixAt(fi,fpZero);
    fpMesh.instanceMatrix.needsUpdate=true;
  }
}

/* ================= 66_spray.js ================= */
/* Spray: a pool of point sprites thrown up by breaking waves and by water hitting posts and rocks. */

/* the 16 biggest obstacles are also sent to the water shader, which draws foam rings around them */
OBSTACLES.sort(function(a,b){return b.r-a.r;});
(function(){
  for(var i=0;i<16&&i<OBSTACLES.length;i++)sharedUniforms.uObs.value[i].set(OBSTACLES[i].x,OBSTACLES[i].z,OBSTACLES[i].r);
})();
/* particles: position spP, velocity spV, size spS (+growth spG), alpha spA, life left spL of spM, brightness spK.
   surfE is how much is breaking near the camera (0..1) - it also drives the surf sound. */
var SPN=2600,
    surfE=0,
    spP=new Float32Array(SPN*3),
    spS=new Float32Array(SPN),
    spA=new Float32Array(SPN),
    spV=new Float32Array(SPN*3),
    spL=new Float32Array(SPN),
    spM=new Float32Array(SPN),
    spG=new Float32Array(SPN),
    spK=new Float32Array(SPN),
    spI=0;
var sprayDir=new THREE.Vector3();
var spGeo=new THREE.BufferGeometry();
spGeo.setAttribute('position',new THREE.BufferAttribute(spP,3));
spGeo.setAttribute('aSize',new THREE.BufferAttribute(spS,1));
spGeo.setAttribute('aAlpha',new THREE.BufferAttribute(spA,1));

var spray=new THREE.Points(spGeo,new THREE.ShaderMaterial({uniforms:spU,transparent:true,depthWrite:false,fog:false,
  vertexShader:glsl('spray.vert'),
  fragmentShader:glsl('spray.frag')}));

scene.add(spray);
function emit(x,y,z,vx,vy,vz,life,size,grow,k){
  var i=spI;
  spI=(spI+1)%SPN;
  spP[i*3]=x;
  spP[i*3+1]=y;
  spP[i*3+2]=z;
  spV[i*3]=vx;
  spV[i*3+1]=vy;
  spV[i*3+2]=vz;
  spL[i]=life;
  spM[i]=life;
  spS[i]=size;
  spG[i]=grow;

/* frame step: spray. Samples the wave model around the camera and throws droplets where lips land, off crests,
   from bores and where water hits posts and rocks; then moves every live droplet. Also sets the surf loudness. */
function updateSpray(F){
  var t=window.__freeze?sharedUniforms.uTime.value:F.t,dt=F.dt,   /* (frozen waves in the test tools: spray follows the frozen wave) */d=F.day,ng=F.night,under=F.under;
  var cpx=camera.position.x,cpz=camera.position.z,crad=Math.hypot(cpx,cpz);
  var cth=Math.atan2(cpz,cpx);
  /* look for breaking water around the stretch of reef the camera is facing (30 m ahead of it), not just beside it */
  camera.getWorldDirection(sprayDir);
  var lth=Math.atan2(cpz+sprayDir.z*30,cpx+sprayDir.x*30);
  if(Math.abs(crad-islandR(cth))<110&&!under){
    var sE=0,rf=Math.min(1,dt*30);
    for(var sk=0;sk<170;sk++){

          sR=islandR(sth)+sgr,
          sx=Math.cos(sth)*sR,
          sz=Math.sin(sth)*sR;
      var se=waveH(sx,sz,t),ix=-Math.cos(sth),iz=-Math.sin(sth),hp=Math.sqrt(WP_H+0.08);
      sE+=WP_imp*2+WP_bore;
      if(WP_imp>0.12&&rnd()<WP_imp*1.6*rf){
        var nn=3+Math.floor(rnd()*9*WP_H);
        for(var sn=0;sn<nn;sn++)emit(sx+ix*0.3+(rnd()-0.5)*0.9,se+0.1+rnd()*0.3*WP_H,sz+iz*0.3+(rnd()-0.5)*0.9,ix*(1+rnd()*2.4)+(rnd()-0.5)*1.4,(1.6+rnd()*3.4)*hp,iz*(1+rnd()*2.4)+(rnd()-0.5)*1.4,0.6+rnd()*0.7,0.035+rnd()*0.055,0.05,0.85);
        if(rnd()<0.5)emit(sx,se+0.25,sz,ix*0.9,0.9+rnd(),iz*0.9,1.2+rnd()*0.9,0.45+rnd()*0.5,1.1,0.15);
        /* the burst where the lip lands: clouds of mist thrown up and forward */
        emit(sx,se+0.3,sz,ix*(0.6+rnd()*1.6),(1.1+rnd()*1.5)*hp,iz*(0.6+rnd()*1.6),1.6+rnd()*1.2,1.0+rnd()*1.2,2.4,0.10);
        emit(sx+(rnd()-0.5)*2,se+0.2,sz+(rnd()-0.5)*2,ix*(0.4+rnd()),(0.7+rnd()*1.0)*hp,iz*(0.4+rnd()),1.8+rnd()*1.2,1.2+rnd()*1.2,2.0,0.08);
      }else if(WP_lip>0.3&&rnd()<WP_lip*0.6*rf){
        emit(sx,se+0.25*WP_H+0.1,sz,-ix*(0.4+rnd())+(rnd()-0.5)*0.5,0.8+rnd()*1.3,-iz*(0.4+rnd())+(rnd()-0.5)*0.5,0.45+rnd()*0.5,0.03+rnd()*0.04,0.04,0.8);
        /* spindrift: mist torn off the top of the lip and carried back over the wave */
        if(rnd()<0.7)emit(sx,se+0.45*WP_H+0.15,sz,-ix*(1.2+rnd()*1.8),0.9+rnd()*1.4,-iz*(1.2+rnd()*1.8),1.3+rnd()*0.9,0.4+rnd()*0.5,1.5,0.11);
      }else if(WP_bore>0.4&&rnd()<WP_bore*0.45*rf){
        emit(sx,se+0.05,sz,ix*(0.5+rnd()*1.2),0.7+rnd()*1.5,iz*(0.5+rnd()*1.2),0.4+rnd()*0.45,0.03+rnd()*0.045,0.04,0.8);
        /* white water carries a low cloud of mist along with it */
        emit(sx+(rnd()-0.5)*1.5,se+0.1+0.3*WP_H,sz+(rnd()-0.5)*1.5,ix*(1.4+rnd()),0.3+rnd()*0.6,iz*(1.4+rnd()),1.0+rnd()*0.8,0.6+rnd()*0.8+WP_H,1.3,0.09);
        if(rnd()<0.35)emit(sx+(rnd()-0.5)*1.5,se+0.2+0.4*WP_H,sz+(rnd()-0.5)*1.5,ix*(1.2+rnd()),0.5+rnd()*0.9,iz*(1.2+rnd()),1.4+rnd()*1.1,0.8+rnd()*1.0+WP_H,1.5,0.08);

      ob.prev=oe;
      if(oe>ob.g+0.06){

        if(pw>0.35&&rnd()<pw*dt*22){

          for(var oj=0;oj<on;oj++){
            var oa=rnd()*6.283;
            emit(ob.x+Math.cos(oa)*ob.r*0.9,oe+0.05,ob.z+Math.sin(oa)*ob.r*0.9,Math.cos(oa)*(0.4+rnd()*1.2),(1.1+rnd()*2.1)*Math.min(1.5,0.5+pw),Math.sin(oa)*(0.4+rnd()*1.2),0.45+rnd()*0.5,0.03+rnd()*0.05,0.04,0.85);
          }
          if(rnd()<0.3)emit(ob.x,oe+0.15,ob.z,0,0.5+rnd()*0.5,0,0.9+rnd()*0.5,0.3+rnd()*0.3+ob.r*0.3,0.8,0.12);
        }
      }
    }
  }
  for(var si=0;si<SPN;si++){
    if(spL[si]>0){
      spL[si]-=dt;
      var s3=si*3,dr=1-1.1*dt;
      spV[s3+1]-=(spG[si]>0.5?2.6:6.8)*dt;   /* mist (the particles that grow) hangs in the air; droplets fall */
      spV[s3]*=dr;
      spV[s3+1]*=dr;
      spV[s3+2]*=dr;
      spP[s3]+=spV[s3]*dt;
      spP[s3+1]+=spV[s3+1]*dt;
      spP[s3+2]+=spV[s3+2]*dt;
      spS[si]+=spG[si]*dt;
      var lf=spL[si]/spM[si];
      spA[si]=spL[si]>0?Math.min(1,(1-lf)*9)*lf*spK[si]:0;
    }
  }
  spGeo.attributes.position.needsUpdate=true;
  spGeo.attributes.aSize.needsUpdate=true;
  spGeo.attributes.aAlpha.needsUpdate=true;
  spU.uPx.value=renderer.getPixelRatio()*VH*0.5/Math.tan(camera.fov*Math.PI/360);
  spU.uCol.value.setRGB((1-0.75*ng),(0.8+0.2*d)*(1-0.75*ng),(0.75+0.25*d)*(1-0.75*ng));
}

/* ================= 70_audio.js ================= */
/* Sound (off until the WAVES button is tapped): filtered-noise surf whose loudness follows the breaking waves, crickets at night. */

var surfGain=null,cricket=null,audioCtx=null,soundOn=false,audioMaster=null,soundBtn=document.getElementById('snd');
soundBtn.addEventListener('click',function(){
  try{
    if(!audioCtx){
      var AC=window.AudioContext||window.webkitAudioContext;
      audioCtx=new AC();
      var len=audioCtx.sampleRate*3,buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate),dd=buf.getChannelData(0),v=0;
      for(var i=0;i<len;i++){
        v=v*0.97+(Math.random()*2-1)*0.03;
        dd[i]=v*6;
      }
      var src=audioCtx.createBufferSource();
      src.buffer=buf;
      src.loop=true;
      var lp=audioCtx.createBiquadFilter();
      lp.type='lowpass';
      lp.frequency.value=900;
      var gn=audioCtx.createGain();
      gn.gain.value=0.35;
      surfGain=gn;
      var lfo=audioCtx.createOscillator();
      lfo.frequency.value=0.7/(2*Math.PI);
      var lg=audioCtx.createGain();
      lg.gain.value=0.25;
      lfo.connect(lg);
      lg.connect(gn.gain);
      var lf=audioCtx.createGain();
      lf.gain.value=350;
      lfo.connect(lf);
      lf.connect(lp.frequency);
      audioMaster=audioCtx.createGain();
      audioMaster.gain.value=0;
      src.connect(lp);
      lp.connect(gn);
      gn.connect(audioMaster);
      audioMaster.connect(audioCtx.destination);
      src.start();
      lfo.start();
      var co=audioCtx.createOscillator();
      co.frequency.value=4400;
      var cg=audioCtx.createGain();
      cg.gain.value=0.5;
      var cl=audioCtx.createOscillator();
      cl.type='square';
      cl.frequency.value=17;
      var clg=audioCtx.createGain();
      clg.gain.value=0.5;
      cl.connect(clg);
      clg.connect(cg.gain);
      var cs=audioCtx.createOscillator();
      cs.frequency.value=0.9;
      var csg=audioCtx.createGain();
      csg.gain.value=0.5;
      cs.connect(csg);
      csg.connect(cg.gain);
      cricket=audioCtx.createGain();
      cricket.gain.value=0;
      co.connect(cg);
      cg.connect(cricket);
      cricket.connect(audioMaster);
      co.start();
      cl.start();
      cs.start();
    }
    soundOn=!soundOn;
    audioCtx.resume();
    audioMaster.gain.linearRampToValueAtTime(soundOn?0.8:0,audioCtx.currentTime+0.6);
    soundBtn.textContent=soundOn?'waves on':'waves off';
  }catch(_){soundBtn.textContent='no audio';}
});

/* frame step: crickets come up at night (the surf loudness is driven from updateSpray, which measures how much is breaking) */
function updateAudio(F){
  if(cricket)cricket.gain.value=F.night*0.035;
}

/* ================= 75_menu.js ================= */
/* The menu under the corner button: choose the time of day, the sky and the wind (each can be left on "auto" to follow
   its own cycle), and turn the sound of the waves on or off. For trying things out; the game will have its own. */
var menuEl=document.createElement('div');
menuEl.id='menu';
menuEl.style.display='none';
/* one row: a label and a button for each choice [text, value]; pick(value) is called with the one pressed */
function menuRow(label,options,pick){
  var row=document.createElement('div'),cap=document.createElement('span'),btns=[];
  row.className='mrow';
  cap.textContent=label;
  row.appendChild(cap);
  options.forEach(function(o){
    var b=document.createElement('button');
    b.className='mopt';
    b.textContent=o[0];
    b.addEventListener('click',function(){
      pick(o[1]);
      btns.forEach(function(x){x.classList.toggle('on',x===b);});
    });
    row.appendChild(b);
    btns.push(b);
  });
  if(btns.length)btns[0].classList.add('on');
  menuEl.appendChild(row);
  return row;
}
menuRow('time',[['auto',null],['dawn',0.19],['day',0.5],['golden',0.754],['sunset',0.825],['night',0]],function(v){
  /* a chosen time is hurried to and then held; "auto" lets the day run on from wherever it is */
  dayHold=v!==null;
  dayTarget=v;
});
menuRow('sky',[['auto',null],['clear',0],['few clouds',0.45],['cloudy',1]],function(v){weather.fixed=v;});
menuRow('wind',[['auto',null],['none',0],['light',0.33],['moderate',0.66],['high',1]],function(v){wind.fixed=v;});
/* the sound button (70_audio.js owns it and writes "waves on" / "waves off" on it) lives here now */
menuRow('sound',[],function(){}).appendChild(soundBtn);
soundBtn.style.display='';
document.body.appendChild(menuEl);
/* (a touch on the menu must not also turn the camera) */
['pointerdown','touchstart','mousedown'].forEach(function(ev){
  menuEl.addEventListener(ev,function(e){e.stopPropagation();});
});
function toggleMenu(){
  menuEl.style.display=menuEl.style.display==='none'?'block':'none';
}

/* ================= 90_main.js ================= */
/* The frame loop. Every system exposes an update function; FRAME_STEPS is the order they run in.
   F is the per-frame state they share: a step may read what earlier steps wrote (see each step's comment). */
var F={ms:0,t:0,dt:0,rawDt:0,       /* clock: ms from requestAnimationFrame, t seconds since start, dt capped step, rawDt real step */
       ground:0,swimming:false,    /* updatePlayer */
       day:1,night:0,vis:1,sunEl:0.6,sunCol:[1,1,1],   /* updateSky */
       sunThru:1,                  /* updateClouds: how much of the sun gets through the clouds to the camera */
       surfY:0,under:false};       /* updateUnderwater */
var FRAME_STEPS=[updateQuality,resize,updatePlayer,updateFootprints,updateCaptions,updateSky,updateClouds,updateUnderwater,updateLights,
                 updateFire,updateAudio,updateModules,updateSpray,updateGlare,updateWater,updateReef,updateInstanceCells];

var VW=0,VH=0;
function resize(){
  var w=window.innerWidth,h=window.innerHeight;
  if(w!==VW||h!==VH){
    VW=w;
    VH=h;
    renderer.setSize(w,h);
    camera.aspect=w/h;
    camera.fov=w<h?72:60;
    camera.updateProjectionMatrix();
  }
}

/* automatic quality: if the phone can't keep ~28 fps, drop resolution, then shadows, then resolution again.
   qStage 0..2 = steps taken so far, 3 = settled (also the test hook window.__noq starts here). */
var qStage=window.__noq?3:0,qN=0,qT=0;
function updateQuality(F){
  var rawDt=F.rawDt;
  if(!intro.on&&qStage<3&&rawDt<1){
    qN++;
    qT+=rawDt;
    if(qN>=90){
      var avg=qT/qN;
      qN=0;
      qT=0;
      if(avg>0.036){
        qStage++;
        if(qStage===1){
          renderer.setPixelRatio(1);
          renderer.setSize(VW,VH);
        }else if(qStage===2){
          sunLight.castShadow=false;
        }else{
          renderer.setPixelRatio(0.75);
          renderer.setSize(VW,VH);
        }
      }else if(avg<0.024)qStage=3;
    }
  }
}

var t0=performance.now(),prev=t0;
function frame(ms){
  F.ms=ms;
  F.rawDt=(ms-prev)/1000;
  F.dt=Math.min(0.05,F.rawDt);
  F.t=(ms-t0)/1000;
  prev=ms;
  for(var i=0;i<FRAME_STEPS.length;i++)FRAME_STEPS[i](F);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
